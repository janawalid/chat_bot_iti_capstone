<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAG Document Assistant</title>
<style>
    :root {
        --imessage-blue: #007AFF;
        --imessage-gray: #E9E9EB;
        --bg: #F2F2F7;
        --text: #000000;
        --text-muted: #6b7280;
        --placeholder: #8E8E93;
        --border: #C6C6C8;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        background-color: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "San Francisco",
            "Segoe UI", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    .page {
        max-width: 700px;
        width: 100%;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        height: 100%;
    }

    /* ---- Header ---- */
    .app-header {
        padding: 1.25rem 1rem 0.5rem 1rem;
        flex-shrink: 0;
    }
    .app-header h1 {
        margin: 0;
        font-size: 2rem;
        font-weight: 700;
    }
    .app-subtitle {
        color: var(--text-muted);
        font-size: 0.95rem;
        margin: 0.4rem 0 0 0;
    }
    .clear-btn {
        background: none;
        border: none;
        color: var(--imessage-blue);
        font-size: 0.85rem;
        cursor: pointer;
        padding: 0;
        margin-top: 0.6rem;
    }
    .clear-btn:hover { text-decoration: underline; }

    /* ---- Chat scroll area ---- */
    .chat-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 0.5rem 1rem;
        display: flex;
        flex-direction: column;
    }

    .msg-row {
        display: flex;
        width: 100%;
        margin-top: 10px;
    }
    .msg-row.sent { justify-content: flex-end; }
    .msg-row.received { justify-content: flex-start; }
    .msg-row.tight { margin-top: 2px; }

    .bubble-col {
        display: flex;
        flex-direction: column;
        max-width: 75%;
    }
    .bubble-col.sent { align-items: flex-end; }
    .bubble-col.received { align-items: flex-start; }

    .bubble {
        padding: 10px 14px;
        font-size: 0.95rem;
        line-height: 1.35;
        border-radius: 20px;
        white-space: pre-wrap;
        word-wrap: break-word;
        animation: bubbleIn 0.22s ease-out;
    }
    .bubble.sent {
        background-color: var(--imessage-blue);
        color: #FFFFFF;
        border-bottom-right-radius: 4px;
    }
    .bubble.received {
        background-color: var(--imessage-gray);
        color: var(--text);
        border-bottom-left-radius: 4px;
    }

    @keyframes bubbleIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .msg-timestamp {
        font-size: 0.68rem;
        color: #9CA3AF;
        margin-top: 3px;
        padding: 0 4px;
    }

    .source-pill {
        display: inline-block;
        background-color: rgba(0, 122, 255, 0.10);
        color: var(--imessage-blue);
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 0.72rem;
        margin: 6px 4px 0 0;
    }
    .sources-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
    }

    /* ---- Typing indicator ---- */
    .typing-dots {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 2px;
    }
    .typing-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #9CA3AF;
        animation: typingBounce 1.1s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typingBounce {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
        30% { transform: translateY(-4px); opacity: 1; }
    }

    /* ---- Example prompt pills ---- */
    .example-row {
        display: flex;
        gap: 8px;
        padding: 0.5rem 1rem 0 1rem;
        flex-wrap: wrap;
        flex-shrink: 0;
    }
    .example-pill {
        border-radius: 999px;
        border: 1px solid #E5E5EA;
        background-color: #FFFFFF;
        color: var(--imessage-blue);
        font-size: 0.82rem;
        font-weight: 500;
        padding: 7px 14px;
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        transition: transform 0.15s ease, background-color 0.15s ease,
            color 0.15s ease, border-color 0.15s ease;
        font-family: inherit;
    }
    .example-pill:hover {
        background-color: var(--imessage-blue);
        color: #FFFFFF;
        border-color: var(--imessage-blue);
        transform: scale(1.06);
    }
    .example-pill:active { transform: scale(0.98); }

    /* ---- Input bar ---- */
    .input-bar {
        flex-shrink: 0;
        padding: 0.75rem 1rem 1.25rem 1rem;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .input-pill {
        flex: 1;
        border-radius: 999px;
        border: 1px solid var(--border);
        background-color: #FFFFFF;
        padding: 10px 16px;
        font-size: 0.95rem;
        color: var(--text);
        font-family: inherit;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .input-pill::placeholder { color: var(--placeholder); }
    .input-pill:focus {
        border-color: var(--imessage-blue);
        box-shadow: 0 0 0 1px var(--imessage-blue);
    }
    .send-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: none;
        background-color: var(--imessage-blue);
        color: #FFFFFF;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition: opacity 0.15s ease;
    }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .send-btn svg { width: 16px; height: 16px; }

    /* ---- Scrollbar ---- */
    .chat-scroll::-webkit-scrollbar { width: 8px; }
    .chat-scroll::-webkit-scrollbar-track { background: transparent; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 8px; }
</style>
</head>
<body>
<div class="page">
    <div class="app-header">
        <h1>RAG Document Assistant</h1>
        <p class="app-subtitle">Ask a question about machine learning concepts — answers are grounded in the document collection, with sources cited.</p>
        <button class="clear-btn" onclick="clearConversation()">Clear conversation</button>
    </div>

    <div class="chat-scroll" id="chatScroll"></div>

    <div class="example-row" id="exampleRow">
        <button class="example-pill" onclick="sendMessage('What is overfitting?')">What is overfitting?</button>
        <button class="example-pill" onclick="sendMessage('How does gradient descent work?')">How does gradient descent work?</button>
        <button class="example-pill" onclick="sendMessage('What is transfer learning?')">What is transfer learning?</button>
        <button class="example-pill" onclick="sendMessage('Bias-variance tradeoff?')">Bias-variance tradeoff?</button>
    </div>

    <div class="input-bar">
        <input
            type="text"
            id="inputBox"
            class="input-pill"
            placeholder="Ask a question about ML concepts..."
            onkeydown="if(event.key==='Enter') sendTyped()"
        />
        <button class="send-btn" id="sendBtn" onclick="sendTyped()">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
        </button>
    </div>
</div>

<script>
    // ---- Point this at your FastAPI backend ----
    const API_BASE_URL = "http://localhost:8000";

    let messages = []; // {role, content, sources, time}

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function timeNow() {
        const d = new Date();
        return d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0");
    }

    function render() {
        const scroll = document.getElementById("chatScroll");
        let html = "";
        let prevRole = null;
        for (const m of messages) {
            const side = m.role === "user" ? "sent" : "received";
            const tight = m.role === prevRole ? " tight" : "";
            let pillsHtml = "";
            if (m.sources && m.sources.length) {
                const pills = m.sources.map(s => `<span class="source-pill">${escapeHtml(s)}</span>`).join("");
                pillsHtml = `<div class="sources-row">${pills}</div>`;
            }
            html += `
                <div class="msg-row ${side}${tight}">
                    <div class="bubble-col ${side}">
                        <div class="bubble ${side}">${escapeHtml(m.content)}</div>
                        ${pillsHtml}
                        <div class="msg-timestamp">${m.time}</div>
                    </div>
                </div>`;
            prevRole = m.role;
        }
        scroll.innerHTML = html;
        scroll.scrollTop = scroll.scrollHeight;
    }

    function showTyping() {
        const scroll = document.getElementById("chatScroll");
        scroll.innerHTML += `
            <div class="msg-row received" id="typingRow">
                <div class="bubble-col received">
                    <div class="bubble received">
                        <div class="typing-dots"><span></span><span></span><span></span></div>
                    </div>
                </div>
            </div>`;
        scroll.scrollTop = scroll.scrollHeight;
    }

    function hideTyping() {
        const row = document.getElementById("typingRow");
        if (row) row.remove();
    }

    async function sendMessage(question) {
        if (!question || !question.trim()) return;

        // Capture history BEFORE pushing the new question, so it only
        // contains prior turns -- the backend appends the current question
        // separately.
        const history = messages
            .slice(-6)
            .map(m => ({ role: m.role, content: m.content }));

        messages.push({ role: "user", content: question, sources: [], time: timeNow() });
        render();

        const sendBtn = document.getElementById("sendBtn");
        sendBtn.disabled = true;
        showTyping();

        try {
            const res = await fetch(`${API_BASE_URL}/query`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question, history }),
            });
            if (!res.ok) throw new Error(`Server responded ${res.status}`);
            const data = await res.json();
            hideTyping();
            messages.push({
                role: "assistant",
                content: data.answer,
                sources: data.sources || [],
                time: timeNow(),
            });
        } catch (err) {
            hideTyping();
            messages.push({
                role: "assistant",
                content: `Couldn't reach the backend: ${err.message}`,
                sources: [],
                time: timeNow(),
            });
        }

        sendBtn.disabled = false;
        render();
    }

    function sendTyped() {
        const box = document.getElementById("inputBox");
        const val = box.value;
        box.value = "";
        sendMessage(val);
    }

    function clearConversation() {
        messages = [];
        render();
    }

    render();
</script>
</body>
</html>
